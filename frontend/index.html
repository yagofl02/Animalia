<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animalia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        margin: 0;
        background: #f8fafc;
      }

      .animalia-marker span {
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        border-radius: 999px;
        background: #ffffff;
        border: 2px solid #ffffff;
        box-shadow: 0 6px 16px rgba(15, 23, 42, 0.25);
        font-size: 20px;
      }

      .animalia-marker span.active {
        transform: scale(1.12);
        box-shadow: 0 0 0 8px rgba(15, 118, 110, 0.16), 0 8px 20px rgba(15, 23, 42, 0.25);
      }

      .animalia-user-marker span {
        position: relative;
        width: 26px;
        height: 26px;
        display: block;
        border-radius: 999px;
        background: #2563eb;
        border: 4px solid #ffffff;
        box-shadow: 0 0 0 7px rgba(37, 99, 235, 0.22), 0 8px 18px rgba(15, 23, 42, 0.28);
      }

      .animalia-user-marker span::after {
        content: "";
        position: absolute;
        inset: -10px;
        border-radius: 999px;
        border: 2px solid rgba(37, 99, 235, 0.35);
        animation: animalia-pulse 1.8s ease-out infinite;
      }

      .leaflet-container {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .animalia-enter {
        animation: animalia-fade-up 0.55s ease both;
      }

      .animalia-hover-card {
        transition: transform 180ms ease, box-shadow 180ms ease, border-color 180ms ease;
      }

      .animalia-hover-card:hover {
        transform: translateY(-3px);
        box-shadow: 0 16px 36px rgba(15, 23, 42, 0.12);
        border-color: rgba(20, 184, 166, 0.38);
      }

      .animalia-float {
        animation: animalia-float 4s ease-in-out infinite;
      }

      .animalia-soft-glow {
        box-shadow: 0 18px 45px rgba(15, 118, 110, 0.18);
      }

      @keyframes animalia-fade-up {
        from {
          opacity: 0;
          transform: translateY(14px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes animalia-float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-8px);
        }
      }

      @keyframes animalia-pulse {
        0% {
          opacity: 0.7;
          transform: scale(0.7);
        }
        100% {
          opacity: 0;
          transform: scale(1.45);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
