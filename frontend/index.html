<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animalia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        margin: 0;
        background: #f8fafc;
      }

      .animalia-marker span {
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        border-radius: 999px;
        background: #ffffff;
        border: 2px solid #ffffff;
        box-shadow: 0 6px 16px rgba(15, 23, 42, 0.25);
        font-size: 20px;
      }

      .animalia-marker span.active {
        transform: scale(1.12);
        box-shadow: 0 0 0 8px rgba(15, 118, 110, 0.16), 0 8px 20px rgba(15, 23, 42, 0.25);
      }

      .animalia-user-marker span {
        width: 22px;
        height: 22px;
        display: block;
        border-radius: 999px;
        background: #2563eb;
        border: 4px solid #ffffff;
        box-shadow: 0 0 0 6px rgba(37, 99, 235, 0.2);
      }

      .leaflet-container {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
